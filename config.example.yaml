usuario:
  nome: Davi            # como o Ultron te chama
  cidade: São Paulo     # usada no clima
  email: davibernardosouza@gmail.com   # seu e-mail pessoal (para me_enviar_email)

ia:
  provedor: gemini      # gemini (GEMINI_API_KEY) | claude (ANTHROPIC_API_KEY)
  modelo: claude-opus-5-5
  modelo_gemini: gemini-3.5-flash
  reservas_gemini: [gemini-3.6-flash, gemini-3.1-flash-lite, gemini-flash-lite-latest]   # usados se o principal estiver sobrecarregado
  esforco: low          # Claude: low = rápido; medium/high = mais raciocínio
  tempo_limite: 15     # segundos; se o modelo travar, pula para o próximo
  esforco_gemini: minimal   # Gemini: minimal (mais rápido) | low | medium | high

voz:
  motor: piper          # piper (voz neural offline) | espeak
  piper: pt_BR-cadu-medium    # outras: pt_BR-faber-medium, pt_BR-jeff-medium
  efeito: ultron        # ultron (grave e metálica) | leve | nenhum

whisper:
  modelo: base          # base (~0,7 s, rápido) | small (~2,2 s, erra menos) | medium (lento)
  modelo_ativacao: base # confere "Ultron" no começo de falas longas

audio:
  microfone: null       # null = padrão do sistema; ou índice de: uv run python -m sounddevice
  saida: null
  limiar_fala: null     # null = calibra sozinho no início
  silencio_fim: 0.8     # segundos de silêncio que encerram a frase
  duracao_max: 15
  interromper: true     # falar por cima do Ultron faz ele parar na hora
  sensibilidade_interrupcao: 2.5   # maior = precisa falar mais alto que o eco da caixa
  blocos_interrupcao: 3 # décimos de segundo de voz contínua para interromper

assistente:
  janela_continuacao: 8 # segundos ouvindo após responder, sem precisar dizer "Ultron"

rede:
  sub_rede: null        # null = detecta (ex.: 192.168.1.0/24)

# Apelidos para dispositivos (o MAC permite achar o IP mesmo se o DHCP mudar
# e ligar via Wake-on-LAN).
dispositivos:
  # pc do quarto: {mac: "aa:bb:cc:dd:ee:ff"}
  # tv da sala:   {ip: 192.168.1.50}

# Computadores que o Ultron controla via SSH (veja o README para criar a chave).
hosts:
  # servidor:
  #   endereco: 192.168.1.20
  #   usuario: davi
  #   chave: ~/.ssh/ultron
  #   sistema: linux     # linux | windows

# Força do desktop: processos pesados rodam no PC de mesa (ferramentas/computacao.py).
computacao:
  maquina: desktop                              # ID em hosts:
  pasta_remota: C:\Users\USUARIO\ultron\trabalhos  # onde as tarefas rodam no desktop
  ligar_automatico: true                        # acorda o desktop pela rede se estiver desligado
  ollama: tunel                                 # IA local na GPU do desktop; 'tunel' = via SSH (não precisa abrir o firewall)
  modelo_local: qwen2.5-coder:7b
  contexto_local: 16384
  vram_gb: 12
  tempo_envio: 900                              # segundos para copiar pastas

# NEURALINK: central de conhecimento (neuralink/, janela: ultron neuralink).
neuralink:
  modelo_embedding: embeddinggemma   # roda na GPU do desktop (Ollama); sem desktop, só busca por palavras
  contexto_automatico: true          # trechos relevantes de documentos entram nos pedidos
  limite_contexto: 3500              # caracteres por pedido
  intervalo_minutos: 10              # reindexa só o que mudou

# Claude Code Bridge (modulos/claude_bridge.py): o Ultron delega tarefas complexas ao Claude Code.
claude_bridge:
  modo: automatico            # local_only | automatico | claude_preferido
  orcamento_diario_usd: 3.0
  orcamento_tarefa_usd: 1.0
  max_simultaneas: 1
  timeout_s: 900
  max_turnos: 30
  espera_aprovacao_s: 300     # quanto o Claude Code espera você aprovar uma ação
  consentimento: []           # diretórios/projetos que podem ser enviados (o painel preenche)
  projetos_privados: []       # nunca saem do computador
  retencao_resumos: 180d

# Sentinel (modulos/sentinel.py): percepção do ambiente. Tudo desligado até você ligar.
sentinel:
  ativo: false
  app_ativo: true             # ler o app em foco (só com ativo: true)
  eventos_sistema: true       # alertas de memória, disco, bateria, serviços e desktop
  guardar_titulos: false      # guardar títulos de janela nas atividades
  ram_minima_gb: 0.8          # abaixo disso avisa (e manda no Telegram)
  processos_permitidos: [python, brave, code, docker, node, java]
  servicos: [ultron-telegram]

# Self Audit: auditoria operacional diária (dados/ultron.db + Scribe/Auditorias).
self_audit:
  hora_diaria: "09:00"        # vazio = só quando pedir
  servicos: [ultron-telegram, ultron-mcp]
  ram_max_mb: 900             # processo do Ultron acima disso é anormal
  cpu_max: 60

casa:
  url: null             # ex.: http://192.168.1.30:8123 (Home Assistant)

telegram:
  dono_id: null         # seu ID numérico (o bot te diz qual é na primeira mensagem)
  pin: null             # ex.: "4821" — se definido, ações N3 pelo celular exigem o PIN
  responder_com_voz: quando_receber_voz   # sempre | quando_receber_voz | nunca
  whisper: base         # modelo para transcrever áudios do Telegram
  tempo_confirmacao: 120

email:
  endereco: null        # e-mail próprio do Ultron, ex.: ultron.davi@gmail.com
  imap: imap.gmail.com
  smtp: smtp.gmail.com

memoria:
  embeddings: ollama    # vetores do cofre e da biblioteca: ollama (embeddinggemma no desktop) | gemini (API)
  aprender: true        # o Ultron revisa as conversas e aprende sozinho
  refletir_a_cada: 3    # pedidos entre cada revisão (correções disparam na hora)
  cofre: ~/Documentos/Ultron Cérebro   # vault do Obsidian com o cérebro dele

mcp:
  porta: 8765
  permitir_n2: true     # ações sensíveis (ex.: comando no Android) liberadas pelo MCP
  permitir_n3: []       # ações críticas liberadas pelo MCP, ex.: [executar_no_computador]

seguranca:
  sempre: []            # ações N2 autorizadas com "sempre" (apague daqui para revogar)
  timeout_ssh: 120
  autoaprovar_minutos: 60   # duração padrão do "ultron autoaprovar" sem tempo (30m, 2h, sempre, off)

visual:
  imagem: dados/ultron.png   # imagem ao lado do nome no terminal
  modo_imagem: auto         # auto | sixel (alta resolução) | blocos
  movimento_reduzido: false # true = núcleo a 8 fps, sem rastros nem rasgos de luz
  capa: dados/capa.png      # retrato da tela de entrada

# Emoções simuladas: aprendem o jeito do Davi responder e colorem o tom (ultron sentimentos).
emocoes:
  ativo: true
  meia_vida_min: 90        # em quanto tempo uma emoção volta metade do caminho para o normal
