[project]
name = "ultron"
version = "0.1.0"
description = "Assistente de voz para a rede local (baseado no jarvis-assistant-vocal)"
readme = "README.md"
authors = [
    { name = "Davi Bernardo", email = "davibernardosouza@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "apprise>=2.1.0",
    "faster-whisper>=1.2.1",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "piper-tts>=1.8.0",
    "pyside6-essentials>=6.12.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "ruamel-yaml>=0.19.1",
    "sounddevice>=0.5.6",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
